version: '3.8'

services:
  python_app:
    build: .
    container_name: python_app
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    container_name: nginx_reverse_proxy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - python_app

